<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 410" role="img" aria-labelledby="title desc">
  <title id="title">Four dependencies locate the car replacement decision boundary</title>
  <desc id="desc">The existing asset, mobility service, replacement choice, and future system and indicator connect to a central keep-or-replace decision.</desc>
  <defs>
    <symbol id="i-car-front" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 8-2 2-1.5-3.7A2 2 0 0 0 15.646 5H8.4a2 2 0 0 0-1.903 1.257L5 10 3 8"/><path d="M7 14h.01M17 14h.01"/><rect width="18" height="8" x="3" y="10" rx="2"/><path d="M5 18v2M19 18v2"/></symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 9 3-3 3 3M13 18H7a2 2 0 0 1-2-2V6M22 15l-3 3-3-3M11 6h6a2 2 0 0 1 2 2v10"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20"/></symbol>
    <style>.k{font:800 12px Arial,sans-serif;letter-spacing:1.4px;fill:#2b6f85}.h{font:700 20px Arial,sans-serif;fill:#173f4d}.t{font:13px Arial,sans-serif;fill:#60757d}.link{fill:none;stroke:#a9bdc3;stroke-width:3}</style>
  </defs>
  <path class="link" d="M352 109C469 109 475 182 530 193M888 109C771 109 765 182 710 193M352 301C469 301 475 228 530 217M888 301C771 301 765 228 710 217"/>
  <g transform="translate(486 148)"><rect width="268" height="114" rx="57" fill="#173f4d"/><text x="134" y="43" text-anchor="middle" font-family="Arial" font-size="13" font-weight="800" letter-spacing="1.2" fill="#7ee1d8">DECISION BOUNDARY</text><text x="134" y="77" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#fff">keep or replace?</text><text x="134" y="98" text-anchor="middle" font-family="Arial" font-size="12" fill="#c9dbe0">cumulative impacts through 2060</text></g>

  <g transform="translate(20 28)"><rect width="332" height="162" rx="18" fill="#f2f7fa" stroke="#9fc1d5" stroke-width="2"/><circle cx="66" cy="75" r="43" fill="#fff" stroke="#9fc1d5" stroke-width="2"/><use href="#i-car-front" x="40" y="49" width="52" height="52" style="color:#2b6f85"/><text class="k" x="126" y="40">01 · EXISTING ASSET</text><text class="h" x="126" y="70">What exists?</text><text class="t" x="126" y="98">age · size · drivetrain</text><text class="t" x="126" y="120">remaining lifetime</text></g>
  <g transform="translate(888 28)"><rect width="332" height="162" rx="18" fill="#f1f8f7" stroke="#9fcfc9" stroke-width="2"/><circle cx="66" cy="75" r="43" fill="#fff" stroke="#9fcfc9" stroke-width="2"/><use href="#i-gauge" x="40" y="49" width="52" height="52" style="color:#168b87"/><text class="k" x="126" y="40">02 · MOBILITY SERVICE</text><text class="h" x="126" y="70">What is needed?</text><text class="t" x="126" y="98">annual distance</text><text class="t" x="126" y="120">common service horizon</text></g>
  <g transform="translate(20 220)"><rect width="332" height="162" rx="18" fill="#fff9ec" stroke="#e3c77e" stroke-width="2"/><circle cx="66" cy="75" r="43" fill="#fff" stroke="#e3c77e" stroke-width="2"/><use href="#i-repeat" x="40" y="49" width="52" height="52" style="color:#d99508"/><text class="k" x="126" y="40">03 · REPLACEMENT</text><text class="h" x="126" y="70">What replaces it?</text><text class="t" x="126" y="98">size · drivetrain · fuel</text><text class="t" x="126" y="120">successor sequence</text></g>
  <g transform="translate(888 220)"><rect width="332" height="162" rx="18" fill="#f7f3fb" stroke="#cdb8dc" stroke-width="2"/><circle cx="66" cy="75" r="43" fill="#fff" stroke="#cdb8dc" stroke-width="2"/><use href="#i-globe" x="40" y="49" width="52" height="52" style="color:#9a70b5"/><text class="k" x="126" y="40">04 · FUTURE + INDICATOR</text><text class="h" x="126" y="70">Which lens?</text><text class="t" x="126" y="98">energy-system scenario</text><text class="t" x="126" y="120">climate · PM · other midpoints</text></g>
</svg>
