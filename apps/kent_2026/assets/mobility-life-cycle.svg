<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title description">
  <title id="title">Passenger-car mobility life cycle</title>
  <desc id="description">A vehicle providing one vehicle-kilometre is connected to vehicle production, energy and driving, maintenance, and end-of-life stages arranged around a dated life-cycle loop.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#6b98a7"/></marker>
    <linearGradient id="road" x1="0" x2="1"><stop stop-color="#edf3f5"/><stop offset="1" stop-color="#dce9ec"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#12384a" flood-opacity=".12"/></filter>
    <symbol id="i-factory" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18V9l-6 4V9l-6 4V4H3Z"/><path d="M7 18h1M12 18h1M17 18h1"/></symbol>
    <symbol id="i-plug-zap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m6 12-2.3 2.3a2.4 2.4 0 0 0 0 3.4l2.6 2.6a2.4 2.4 0 0 0 3.4 0L12 18Z"/><path d="m2 22 3-3M7.5 13.5 10 11M10.5 16.5 13 14M18 2l-4 5h6l-4 5"/></symbol>
    <symbol id="i-wrench" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94Z"/></symbol>
    <symbol id="i-recycle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19H4.8a1.8 1.8 0 0 1-1.6-2.7L7.2 9.5M11 19h8.2a1.8 1.8 0 0 0 1.6-2.7l-1.3-2.1M14 16l-3 3 3 3M8.3 13.6 7.2 9.5 3.1 10.6M9.3 5.8l1.1-1.9a1.8 1.8 0 0 1 3.1 0l4 6.8M13.4 9.6l4.1 1.1 1.1-4.1"/></symbol>
    <symbol id="i-car" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></symbol>
  </defs>

  <path d="M206 124 C330 30 574 30 697 124" fill="none" stroke="#6b98a7" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M700 294 C575 389 329 389 205 294" fill="none" stroke="#6b98a7" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(34 50)" filter="url(#shadow)">
    <rect width="220" height="108" rx="16" fill="#f3f6f7" stroke="#b9d3dc" stroke-width="2"/>
    <rect width="220" height="7" rx="4" fill="#006b8f"/>
    <circle cx="43" cy="57" r="27" fill="#e3f1f5"/>
    <use href="#i-factory" x="20" y="34" width="46" height="46" style="color:#006b8f"/>
    <text x="82" y="31" font-family="Arial,sans-serif" font-size="11.5" font-weight="800" fill="#5b6a74">2020</text>
    <text x="82" y="55" font-family="Arial,sans-serif" font-size="16" font-weight="800" fill="#0b3b52">Vehicle</text>
    <text x="82" y="73" font-family="Arial,sans-serif" font-size="16" font-weight="800" fill="#0b3b52">production</text>
    <text x="82" y="94" font-family="Arial,sans-serif" font-size="10.5" fill="#5b6a74">materials · battery</text>
  </g>

  <g transform="translate(646 50)" filter="url(#shadow)">
    <rect width="220" height="108" rx="16" fill="#f3f6f7" stroke="#acd8d4" stroke-width="2"/>
    <rect width="220" height="7" rx="4" fill="#008a82"/>
    <circle cx="43" cy="57" r="27" fill="#e1f3f1"/>
    <use href="#i-plug-zap" x="20" y="34" width="46" height="46" style="color:#008a82"/>
    <text x="82" y="35" font-family="Arial,sans-serif" font-size="11.5" font-weight="800" fill="#5b6a74">2020–36</text>
    <text x="82" y="62" font-family="Arial,sans-serif" font-size="16" font-weight="800" fill="#0b3b52">Energy &amp; driving</text>
    <text x="82" y="86" font-family="Arial,sans-serif" font-size="10.5" fill="#5b6a74">fuel · electricity · exhaust</text>
  </g>

  <g transform="translate(646 263)" filter="url(#shadow)">
    <rect width="220" height="108" rx="16" fill="#f3f6f7" stroke="#d4c4e6" stroke-width="2"/>
    <rect width="220" height="7" rx="4" fill="#7656a8"/>
    <circle cx="43" cy="57" r="27" fill="#eee8f5"/>
    <use href="#i-wrench" x="20" y="34" width="46" height="46" style="color:#7656a8"/>
    <text x="82" y="35" font-family="Arial,sans-serif" font-size="11.5" font-weight="800" fill="#5b6a74">through life</text>
    <text x="82" y="62" font-family="Arial,sans-serif" font-size="16" font-weight="800" fill="#0b3b52">Maintenance</text>
    <text x="82" y="86" font-family="Arial,sans-serif" font-size="10.5" fill="#5b6a74">tyres · parts · road</text>
  </g>

  <g transform="translate(34 263)" filter="url(#shadow)">
    <rect width="220" height="108" rx="16" fill="#f3f6f7" stroke="#efd390" stroke-width="2"/>
    <rect width="220" height="7" rx="4" fill="#d99614"/>
    <circle cx="43" cy="57" r="27" fill="#fbf0d5"/>
    <use href="#i-recycle" x="20" y="34" width="46" height="46" style="color:#d99614"/>
    <text x="82" y="35" font-family="Arial,sans-serif" font-size="11.5" font-weight="800" fill="#5b6a74">2037</text>
    <text x="82" y="62" font-family="Arial,sans-serif" font-size="16" font-weight="800" fill="#0b3b52">End-of-life</text>
    <text x="82" y="86" font-family="Arial,sans-serif" font-size="10.5" fill="#5b6a74">treatment · recovery</text>
  </g>

  <g transform="translate(292 126)" filter="url(#shadow)">
    <path d="M26 181C61 104 255 104 290 181L251 207C204 186 112 186 65 207Z" fill="url(#road)" stroke="#b9d1d7" stroke-width="2.5"/>
    <path d="M66 194C108 152 208 152 250 194" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="18 14"/>
    <path d="M26 181C61 104 255 104 290 181" fill="none" stroke="#8fb2bc" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(62 65)">
      <path d="M12 93H4V77c0-9 6-17 15-20l18-5 15-30c4-8 11-12 20-12h63c9 0 16 3 22 10l25 29 25 7c10 3 17 12 17 23v14h-13" fill="#0b3b52"/>
      <path d="M48 50 61 25c2-4 6-7 11-7h23v32ZM104 18h28c5 0 9 2 13 6l21 26h-62Z" fill="#dce9ed"/>
      <path d="M23 58h157" stroke="#1a6078" stroke-width="3" stroke-linecap="round"/>
      <rect x="12" y="64" width="16" height="7" rx="3.5" fill="#f4c65f"/>
      <rect x="181" y="64" width="14" height="7" rx="3.5" fill="#d7f0ed"/>
      <circle cx="48" cy="93" r="20" fill="#0b3b52" stroke="#fff" stroke-width="6"/>
      <circle cx="48" cy="93" r="6" fill="#9fc0c9"/>
      <circle cx="157" cy="93" r="20" fill="#0b3b52" stroke="#fff" stroke-width="6"/>
      <circle cx="157" cy="93" r="6" fill="#9fc0c9"/>
    </g>
    <rect x="76" y="218" width="164" height="42" rx="21" fill="#006b8f"/>
    <text x="158" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="900" fill="#fff">1 vehicle-km</text>
    <text x="158" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#5b6a74">the mobility service</text>
  </g>
</svg>
