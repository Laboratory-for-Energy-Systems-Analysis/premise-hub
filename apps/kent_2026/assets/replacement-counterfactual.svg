<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 360" role="img" aria-labelledby="title desc">
  <title id="title">Keep or replace counterfactual</title>
  <desc id="desc">A shared vehicle history reaches an owner decision in 2026, then branches into keep and replace pathways that provide the same mobility service through 2060.</desc>
  <defs>
    <linearGradient id="commonCard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef5f8"/><stop offset="1" stop-color="#f9fbfc"/></linearGradient>
    <linearGradient id="keepCard" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff8e9"/><stop offset="1" stop-color="#fffdf8"/></linearGradient>
    <linearGradient id="replaceCard" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#edf9f7"/><stop offset="1" stop-color="#fbfefd"/></linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#173f4d" flood-opacity=".10"/></filter>
    <symbol id="car" viewBox="0 0 110 48">
      <path d="M8 34h5l6-15c2-5 6-8 12-9l31-2c7 0 12 2 17 7l10 10 10 2c4 1 6 4 6 8v3H8Z" fill="currentColor"/>
      <path d="m27 19 8-6h26c5 0 9 2 13 6l5 6H24Z" fill="#fff" opacity=".86"/>
      <path d="M50 12v13" stroke="currentColor" stroke-width="3" opacity=".65"/>
      <circle cx="28" cy="38" r="8" fill="#173f4d" stroke="#fff" stroke-width="3"/><circle cx="84" cy="38" r="8" fill="#173f4d" stroke="#fff" stroke-width="3"/>
    </symbol>
    <symbol id="owner" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4" fill="currentColor"/><path d="M4 22c0-6 3-9 8-9s8 3 8 9Z" fill="currentColor"/></symbol>
    <style>
      .kicker{font:800 12px Arial,sans-serif;letter-spacing:1.5px;fill:#2b6f85}.title{font:700 22px Arial,sans-serif;fill:#173f4d}.body{font:15px Arial,sans-serif;fill:#526d77}.label{font:700 14px Arial,sans-serif;fill:#173f4d}.micro{font:13px Arial,sans-serif;fill:#607982}.cohort{font-weight:800}.c20{fill:#b76c00}.c27{fill:#0f7476}.c36{fill:#1b7e7e}.c43{fill:#238f89}.c53{fill:#4d9f98}.year{font:800 16px Arial,sans-serif;fill:#173f4d}.inverse{font:800 13px Arial,sans-serif;fill:#fff;letter-spacing:.7px}.lane{fill:none;stroke-width:7;stroke-linecap:round}.node{fill:#fff;stroke-width:4}
    </style>
  </defs>

  <text class="kicker" x="18" y="21">FROM TECHNOLOGY OPTIONS TO ONE OWNER DECISION</text>
  <g transform="translate(951 3)"><rect width="271" height="31" rx="15.5" fill="#e4f3f1"/><circle cx="17" cy="15.5" r="5" fill="#168b87"/><text x="31" y="20" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#0b6864">12,000 km/y · 200,000 km vehicle life</text></g>

  <g filter="url(#shadow)"><rect x="18" y="34" width="252" height="310" rx="17" fill="url(#commonCard)" stroke="#bfd3da"/></g>
  <text class="kicker" x="38" y="58">SHARED HISTORY</text><text class="title" x="38" y="82">The car already exists</text><text class="body" x="38" y="103">Medium gasoline car</text>
  <g transform="translate(64 120) scale(1.42)" color="#367e96"><use href="#car" width="110" height="48"/></g>
  <circle cx="92" cy="194" r="4" fill="#f0a11c"/><text class="micro cohort c20" x="101" y="198">2020 cohort</text>
  <line x1="49" y1="213" x2="240" y2="213" stroke="#2b6f85" stroke-width="6" stroke-linecap="round"/><circle cx="49" cy="213" r="8" fill="#fff" stroke="#2b6f85" stroke-width="4"/><circle cx="240" cy="213" r="8" fill="#f2ab45" stroke="#fff" stroke-width="4"/>
  <text class="year" x="38" y="240">2020</text><text class="micro" x="38" y="259">manufactured</text><text class="year" x="205" y="240">2026</text><text class="micro" x="157" y="259">owner decision</text>
  <rect x="38" y="286" width="212" height="44" rx="9" fill="#fff" stroke="#cfdee2"/><text class="label" x="52" y="305">Past impacts retained</text><text class="micro" x="52" y="322">in both pathways</text>

  <line x1="301" y1="45" x2="301" y2="338" stroke="#f2ab45" stroke-width="3" stroke-dasharray="7 7"/>
  <g transform="translate(281 240) rotate(-90)"><rect width="146" height="40" rx="20" fill="#d98c00"/><text class="inverse" x="17" y="25">2026 · DECISION</text></g>
  <path d="M270 213H301C318 213 318 126 340 126" fill="none" stroke="#829aa3" stroke-width="3"/><path d="M301 213C318 213 318 277 340 277" fill="none" stroke="#829aa3" stroke-width="3"/>

  <g filter="url(#shadow)"><rect x="340" y="34" width="882" height="160" rx="17" fill="url(#keepCard)" stroke="#e7c77f"/></g>
  <rect x="358" y="49" width="72" height="27" rx="13.5" fill="#d98c00"/><text class="inverse" x="374" y="67">KEEP</text><text class="title" x="445" y="70">Use the current car to retirement</text><text class="micro" x="445" y="91">84,000 km already driven → dismantling in 2036; another handover in 2053.</text>
  <path class="lane" d="M382 132H616" stroke="#d98c00"/><path class="lane" d="M616 132H1013" stroke="#168b87"/><path class="lane" d="M1013 132H1176" stroke="#65bdb4"/>
  <circle class="node" cx="382" cy="132" r="9" stroke="#d98c00"/><circle class="node" cx="616" cy="132" r="9" stroke="#168b87"/><circle class="node" cx="1013" cy="132" r="9" stroke="#65bdb4"/><circle class="node" cx="1176" cy="132" r="9" stroke="#65bdb4"/>
  <path d="M616 122V119" stroke="#b87600" stroke-width="2.5"/><path d="m611 120 5-7 5 7Z" fill="#b87600"/>
  <rect x="557" y="96" width="118" height="24" rx="8" fill="#fff4d9" stroke="#e1bd69"/><circle cx="574" cy="108" r="7" fill="#d98c00"/><path d="m570.5 104.5 7 7m0-7-7 7" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><text x="586" y="112" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="#805400">DISMANTLING</text>
  <g transform="translate(440 104) scale(.78)" color="#f0a11c"><use href="#car" width="110" height="48"/></g><g transform="translate(750 104) scale(.78)" color="#1b8c8b"><use href="#car" width="110" height="48"/></g><g transform="translate(1043 107) scale(.68)" color="#86cec6"><use href="#car" width="110" height="48"/></g>
  <circle cx="443" cy="157" r="4" fill="#f0a11c"/><text class="micro cohort c20" x="451" y="161">2020 · current ICEV</text><circle cx="756" cy="157" r="4" fill="#1b8c8b"/><text class="micro cohort c36" x="764" y="161">2036 · BEV #1</text><circle cx="1043" cy="157" r="4" fill="#86cec6"/><text class="micro cohort c53" x="1051" y="161">2053+ · BEV #2</text>
  <text class="label" x="575" y="184">2036 change</text><text class="label" x="972" y="184">2053 change</text><text class="year" x="1154" y="184">2060</text>

  <g filter="url(#shadow)"><rect x="340" y="204" width="882" height="140" rx="17" fill="url(#replaceCard)" stroke="#9bcfc9"/></g>
  <rect x="358" y="219" width="92" height="27" rx="13.5" fill="#168b87"/><text class="inverse" x="372" y="237">REPLACE</text><text class="title" x="465" y="240">Trigger new production after 2026</text><text class="micro" x="465" y="261">Three new BEVs enter the owner timeline: 2027, 2043 and—during the final year—2060.</text>
  <path class="lane" d="M382 288H776" stroke="#168b87"/><path class="lane" d="M776 288H1153" stroke="#38a59e"/><path class="lane" d="M1153 288H1192" stroke="#79c8c1"/>
  <circle class="node" cx="382" cy="288" r="9" stroke="#168b87"/><circle class="node" cx="776" cy="288" r="9" stroke="#38a59e"/><circle class="node" cx="1153" cy="288" r="9" stroke="#79c8c1"/><circle class="node" cx="1192" cy="288" r="9" stroke="#79c8c1"/>
  <g transform="translate(590 260) scale(.78)" color="#0f7476"><use href="#car" width="110" height="48"/></g><g transform="translate(899 260) scale(.78)" color="#2da39d"><use href="#car" width="110" height="48"/></g><g transform="translate(1129 266) scale(.52)" color="#a3ddd7"><use href="#car" width="110" height="48"/></g>
  <circle cx="602" cy="311" r="4" fill="#0f7476"/><text class="micro cohort c27" x="610" y="315">2027 · BEV #1</text><circle cx="910" cy="311" r="4" fill="#2da39d"/><text class="micro cohort c43" x="918" y="315">2043 · BEV #2</text><circle cx="1055" cy="311" r="4" fill="#86cec6"/><text class="micro cohort c53" x="1063" y="315">2060 · BEV #3 · 8,000 km</text>
  <text class="label" x="735" y="338">2043 change</text><text class="label" x="1108" y="338">2060 change</text>
  <path d="M382 297v4" stroke="#829aa3" stroke-width="2.5"/>
  <rect x="350" y="301" width="220" height="34" rx="9" fill="#fff" stroke="#c8dfdc"/>
  <g transform="translate(360 307) scale(.28)" color="#f0a11c"><use href="#car" width="110" height="48"/></g>
  <path d="M398 318h22" stroke="#829aa3" stroke-width="2.5"/><path d="m416 314 7 4-7 4Z" fill="#829aa3"/>
  <g transform="translate(429 306)" color="#2b6f85"><use href="#owner" width="20" height="20"/></g>
  <text x="454" y="316" font-family="Arial,sans-serif" font-size="11" font-weight="800" fill="#173f4d">2027 · NEW OWNER</text><text x="454" y="330" font-family="Arial,sans-serif" font-size="10" fill="#607982">current car changes hands</text>
</svg>
