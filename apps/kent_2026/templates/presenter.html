<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Kent presenter notes</title>
<style>body{font:16px/1.5 Arial,sans-serif;color:#17324d;margin:0;background:#eef3f4}header{position:sticky;top:0;background:#17324d;color:white;padding:14px 24px;display:flex;justify-content:space-between}main{max-width:900px;margin:24px auto}.note{background:white;border-radius:14px;padding:20px;margin:16px 0;border-left:6px solid #168f88}.note h2{margin:0 0 6px}.cue{font-weight:700;color:#0f6a66}.muted{color:#6c7b88}button{padding:8px 12px}</style></head>
<body><header><strong>Kent Seminar · presenter view</strong><span><button id="timer">Start {{ talk_label }}</button> <span id="clock">{{ talk_label }}</span></span></header><main>
{% for slide in slides %}<section class="note" id="note-{{ loop.index0 }}"><div class="muted">Slide {{ loop.index }} / {{ core_count }} · {{ slide.seconds }} sec</div><h2>{{ slide.title }}</h2><p class="cue">{{ slide.cue }}</p><p>{{ slide.notes }}</p></section>{% endfor %}
</main><script>let running=false,left={{ talk_seconds }},id;const clock=document.getElementById('clock'),button=document.getElementById('timer');function show(){clock.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}button.onclick=()=>{running=!running;button.textContent=running?'Pause':'Resume';if(running)id=setInterval(()=>{left=Math.max(0,left-1);show();if(!left)clearInterval(id)},1000);else clearInterval(id)};window.addEventListener('storage',e=>{if(e.key==='kent-2026-slide'){try{const i=JSON.parse(e.newValue).index;document.getElementById('note-'+i)?.scrollIntoView({behavior:'smooth'})}catch(_){}}});</script></body></html>
