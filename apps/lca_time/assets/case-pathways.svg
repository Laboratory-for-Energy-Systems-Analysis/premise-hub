<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 370" role="img" aria-labelledby="title desc">
  <title id="title">BECCS and DACCS carbon pathways</title>
  <desc id="desc">Atmospheric carbon follows either a forest and new bioenergy-with-capture route or a solid-sorbent direct-air-capture route before both streams converge on geological storage. The greenfield BECCS counterfactual leaves the existing mature forest standing at constant carbon stock and buys equivalent electricity and heat from Northern European markets.</desc>
  <defs>
    <marker id="arrow-forest" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#3e7654"/>
    </marker>
    <marker id="arrow-sky" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#4193b8"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#008a82"/>
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#c44e52"/>
    </marker>
    <filter id="node-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#17303d" flood-opacity=".09"/>
    </filter>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .route-label { font-size: 16px; font-weight: 900; letter-spacing: 1.4px; }
      .node { fill: #fff; stroke: #cfdbdf; stroke-width: 1.4; filter: url(#node-shadow); }
      .node-title { fill: #0b3b52; font-size: 17px; font-weight: 800; text-anchor: middle; }
      .node-note { fill: #5b6a74; font-size: 12px; text-anchor: middle; }
      .node-title-left { fill: #0b3b52; font-size: 17px; font-weight: 800; }
      .node-note-left { fill: #5b6a74; font-size: 12px; }
      .tag-text { fill: #47616d; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .source-title { fill: #0b3b52; font-size: 18px; font-weight: 800; text-anchor: middle; }
      .source-note { fill: #5b6a74; font-size: 12px; text-anchor: middle; }
      .flow-forest { fill: none; stroke: #3e7654; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .flow-sky { fill: none; stroke: #4193b8; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .flow-shared { fill: none; stroke: #008a82; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Route labels -->
  <text x="240" y="25" class="route-label" fill="#3e7654">BECCS · NEW CHP + CCS ROUTE</text>
  <text x="240" y="239" class="route-label" fill="#4193b8">DACCS · ENGINEERED ROUTE</text>

  <!-- Carbon-flow connectors sit behind the process nodes -->
  <path d="M191 151 C216 151 218 98 244 98" class="flow-forest" marker-end="url(#arrow-forest)"/>
  <path d="M385 98 H424" class="flow-forest" marker-end="url(#arrow-forest)"/>
  <path d="M565 98 H604" class="flow-forest" marker-end="url(#arrow-forest)"/>
  <path d="M745 98 H784" class="flow-forest" marker-end="url(#arrow-forest)"/>
  <path d="M925 98 C990 98 993 173 1054 184" class="flow-forest"/>

  <path d="M191 194 C216 194 218 289 244 289" class="flow-sky" marker-end="url(#arrow-sky)"/>
  <path d="M530 289 H649" class="flow-sky" marker-end="url(#arrow-sky)"/>
  <path d="M885 289 C983 289 991 199 1054 184" class="flow-sky"/>

  <!-- Common atmospheric source -->
  <rect x="20" y="122" width="171" height="102" rx="22" fill="#edf6f8" stroke="#b8d4de" stroke-width="1.5"/>
  <path d="M59 177 C47 177 39 169 39 158 C39 148 46 140 56 138 C60 124 72 116 87 116 C103 116 117 127 120 142 C124 140 129 139 134 139 C148 139 158 148 158 159 C158 170 149 177 136 177 Z" fill="#fff" stroke="#4193b8" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M57 178 H137" stroke="#b8d4de" stroke-width="2" stroke-linecap="round"/>
  <text x="105.5" y="198" class="source-title">Atmospheric CO₂</text>
  <text x="105.5" y="215" class="source-note">both pathways start here</text>

  <!-- Forest node -->
  <rect x="245" y="45" width="140" height="106" rx="15" class="node"/>
  <circle cx="315" cy="82" r="25" fill="#e2eee5"/>
  <g fill="none" stroke="#3e7654" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M298 94 V77 M287 83 L298 64 L309 83 Z"/>
    <path d="M327 94 V70 M313 80 L327 57 L341 80 Z"/>
    <path d="M285 95 H345" stroke="#936d4f"/>
  </g>
  <text x="315" y="128" class="node-title">Forest</text>
  <text x="315" y="143" class="node-note">Norway spruce</text>

  <!-- Woodchip node -->
  <rect x="425" y="45" width="140" height="106" rx="15" class="node"/>
  <circle cx="495" cy="82" r="25" fill="#e2eee5"/>
  <g stroke="#936238" stroke-width="1.1" stroke-linejoin="round">
    <path d="M470 99 L476 89 L482 91 L487 81 L494 86 L500 76 L507 85 L514 80 L520 89 L525 99 Z" fill="#bd8148"/>
    <path d="M478 87 L484 79 L490 84 L486 92 Z" fill="#d7a469"/>
    <path d="M492 84 L498 73 L505 78 L503 90 Z" fill="#c58b50"/>
    <path d="M507 86 L514 75 L520 83 L518 93 Z" fill="#d7a469"/>
    <path d="M478 73 L484 67 L490 74 L484 78 Z" fill="#c58b50"/>
    <path d="M498 67 L505 64 L510 71 L503 75 Z" fill="#d7a469"/>
    <path d="M514 69 L521 66 L523 74 L517 77 Z" fill="#bd8148"/>
    <path d="M471 99 H526" fill="none" stroke="#8c674b" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="495" y="128" class="node-title">Wood chips</text>
  <text x="495" y="143" class="node-note">forest supply</text>

  <!-- CHP node -->
  <rect x="605" y="45" width="140" height="106" rx="15" class="node"/>
  <circle cx="675" cy="82" r="25" fill="#e2eee5"/>
  <g stroke="#0b3b52" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M650 99 V79 L661 86 V78 L673 86 V68 H689 V99 Z" fill="#fff"/>
    <path d="M682 68 V57 H691 V99" fill="#fff"/>
    <path d="M647 99 H696" fill="none"/>
    <path d="M686 53 C681 48 691 45 687 40" fill="none" stroke="#92a4ad"/>
    <path d="M656 92 H661 M668 92 H673" fill="none" stroke="#d99614"/>
  </g>
  <text x="675" y="128" class="node-title">New CHP</text>
  <text x="675" y="143" class="node-note">heat + power</text>

  <!-- Capture node -->
  <rect x="785" y="45" width="140" height="106" rx="15" class="node"/>
  <circle cx="855" cy="82" r="25" fill="#e2eee5"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="837" y="63" width="16" height="38" rx="5" fill="#edf6f8" stroke="#0b3b52" stroke-width="2.1"/>
    <rect x="861" y="63" width="16" height="38" rx="5" fill="#fff5de" stroke="#0b3b52" stroke-width="2.1"/>
    <path d="M840 74 H850 M840 82 H850 M840 90 H850" stroke="#77a9ba" stroke-width="1.3"/>
    <path d="M853 70 H861 M853 94 H861" fill="none" stroke="#0b3b52" stroke-width="2"/>
    <path d="M828 92 H837" fill="none" stroke="#92a4ad" stroke-width="2"/>
    <path d="M833 88 L837 92 L833 96" fill="none" stroke="#92a4ad" stroke-width="2"/>
    <path d="M845 63 V55" fill="none" stroke="#92a4ad" stroke-width="2"/>
    <path d="M842 59 L845 55 L848 59" fill="none" stroke="#92a4ad" stroke-width="2"/>
    <path d="M869 63 V54 H880" fill="none" stroke="#008a82" stroke-width="2.2"/>
    <path d="M876 50 L880 54 L876 58" fill="none" stroke="#008a82" stroke-width="2.2"/>
    <path d="M865 96 C867 92 869 100 871 96 C873 92 875 100 877 96" fill="none" stroke="#d99614" stroke-width="1.6"/>
  </g>
  <text x="855" y="128" class="node-title">CO₂ capture</text>
  <text x="855" y="143" class="node-note">post-combustion</text>

  <!-- Greenfield BECCS reference arm -->
  <path d="M315 151 V158" fill="none" stroke="#7f929a" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="245" y="158" width="680" height="59" rx="12" fill="#f4f7f7" stroke="#c9d6da"/>
  <text x="260" y="174" fill="#3e7654" font-size="10" font-weight="900" letter-spacing=".8">REFERENCE CASE · NO PROJECT</text>
  <text x="260" y="192" fill="#47616d" font-size="10.5" font-weight="700">standing forest · equivalent energy purchased</text>
  <text x="260" y="207" fill="#6b7d85" font-size="9.5" font-weight="700">no harvest · no new plant · no geological storage</text>

  <rect x="520" y="168" width="182" height="36" rx="10" fill="#f9eded" stroke="#dfb8bb"/>
  <path d="M537 191 C530 191 526 187 527 181 C528 177 532 175 536 176 C538 170 544 168 549 172 C554 168 562 171 563 177 C570 176 575 179 575 184 C575 188 571 191 565 191 Z" fill="#fff" stroke="#c44e52" stroke-width="1.3"/>
  <path d="M506 186 H523" fill="none" stroke="#c44e52" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <text x="640" y="182" fill="#96383d" font-size="10" font-weight="900" text-anchor="middle">FOREST LEFT STANDING</text>
  <text x="640" y="196" fill="#6b7d85" font-size="9.2" font-weight="700" text-anchor="middle">constant-stock approximation</text>

  <rect x="713" y="168" width="198" height="36" rx="10" fill="#fff5de" stroke="#ead49e"/>
  <path d="M730 174 L723 184 H730 L726 199 L741 182 H734 L738 174 Z" fill="#d99614"/>
  <path d="M747 178 C743 174 750 171 746 166 M757 178 C753 174 760 171 756 166" fill="none" stroke="#d99614" stroke-width="1.7" stroke-linecap="round"/>
  <text x="825" y="182" fill="#80560b" font-size="10" font-weight="900" text-anchor="middle">BUY EQUIVALENT ENERGY</text>
  <text x="825" y="196" fill="#6b7d85" font-size="9.2" font-weight="700" text-anchor="middle">Northern European power + heat</text>

  <!-- Solid-sorbent DAC node -->
  <rect x="245" y="245" width="285" height="88" rx="15" class="node"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="258" y="263" width="61" height="52" rx="8" fill="#edf6f9" stroke="#0b3b52" stroke-width="2.3"/>
    <circle cx="276" cy="289" r="12" fill="#fff" stroke="#4193b8" stroke-width="2"/>
    <g fill="#b8dce9" stroke="#4193b8" stroke-width="1">
      <path d="M276 289 C270 283 271 278 276 278 C282 279 282 284 276 289 Z"/>
      <path d="M276 289 C283 287 287 291 284 296 C281 301 277 296 276 289 Z"/>
      <path d="M276 289 C275 296 270 299 267 294 C264 289 270 286 276 289 Z"/>
    </g>
    <g stroke="#4193b8" stroke-width="2">
      <path d="M296 272 V306 M303 272 V306 M310 272 V306"/>
      <path d="M248 279 H256 M248 289 H256 M248 299 H256"/>
    </g>
    <path d="M319 278 H325 M319 289 H325 M319 300 H325" stroke="#008a82" stroke-width="2"/>
  </g>
  <text x="330" y="283" class="node-title-left">Solid-sorbent DAC</text>
  <text x="330" y="303" class="node-note-left">low-temperature regeneration</text>

  <!-- Conditioning node -->
  <rect x="650" y="245" width="235" height="88" rx="15" class="node"/>
  <rect x="660" y="264" width="62" height="50" rx="12" fill="#e2f0f6"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M654 289 H663" fill="none" stroke="#4193b8" stroke-width="2.2"/>
    <path d="M659 285 L663 289 L659 293" fill="none" stroke="#4193b8" stroke-width="2"/>

    <circle cx="678" cy="289" r="15" fill="#fff" stroke="#0b3b52" stroke-width="2.2"/>
    <path d="M669 299 V279 L688 289 Z" fill="#b8dce9" stroke="#4193b8" stroke-width="1.4"/>
    <circle cx="678" cy="289" r="2.5" fill="#0b3b52"/>

    <path d="M693 289 H696" fill="none" stroke="#0b3b52" stroke-width="2.2"/>
    <circle cx="707" cy="289" r="11" fill="#fff" stroke="#0b3b52" stroke-width="2.2"/>
    <path d="M701 296 V282 L714 289 Z" fill="#9bcbd9" stroke="#4193b8" stroke-width="1.2"/>
    <circle cx="707" cy="289" r="2" fill="#0b3b52"/>

    <path d="M718 289 H725 V276" fill="none" stroke="#008a82" stroke-width="2.2"/>
    <path d="M721 280 L725 276 L729 280" fill="none" stroke="#008a82" stroke-width="2"/>
    <circle cx="712" cy="269" r="6" fill="#fff" stroke="#0b3b52" stroke-width="1.5"/>
    <path d="M712 269 L715 266" stroke="#c44e52" stroke-width="1.4"/>
    <path d="M712 275 V278 H718" fill="none" stroke="#0b3b52" stroke-width="1.4"/>
  </g>
  <text x="730" y="283" class="node-title-left">CO₂ conditioning</text>
  <text x="730" y="303" class="node-note-left">drying + compression</text>

  <!-- DACCS energy input -->
  <path d="M385 349 V333" fill="none" stroke="#d99614" stroke-width="2"/>
  <rect x="245" y="339" width="320" height="27" rx="13.5" fill="#fff5de" stroke="#ead49e"/>
  <path d="M265 345 L259 353 H265 L262 360 L274 349 H268 L271 345 Z" fill="#d99614"/>
  <text x="407" y="357" class="tag-text">Electricity + low-temperature heat</text>

  <!-- Shared transport and geological storage -->
  <path d="M1054 184 H1064" fill="none" stroke="#008a82" stroke-width="3.5" marker-end="url(#arrow-teal)"/>

  <!-- Dedicated transport node: raised pipe, flanges, supports and isolation valve -->
  <rect x="1065" y="134" width="150" height="104" rx="15" class="node"/>
  <path d="M1080 181 H1090 Q1098 181 1098 173 V169 H1180 V181 H1198" fill="none" stroke="#008a82" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1080 181 H1090 Q1098 181 1098 173 V169 H1180 V181 H1198" fill="none" stroke="#dff1ee" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="none" stroke="#008a82" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1115 159 V179 M1121 159 V179" stroke-width="2.4"/>
    <path d="M1160 159 V179 M1166 159 V179" stroke-width="2.4"/>
    <path d="M1104 176 V194 H1127 V176 M1154 176 V194 H1176 V176" stroke-width="2"/>
    <path d="M1100 194 H1131 M1150 194 H1180" stroke-width="2"/>
    <circle cx="1141" cy="151" r="9" stroke-width="2.2"/>
    <path d="M1141 142 V160 M1132 151 H1150 M1135 145 L1147 157 M1147 145 L1135 157 M1141 160 V169" stroke-width="1.7"/>
  </g>
  <text x="1140" y="216" class="node-title">CO₂ pipeline</text>
  <text x="1140" y="231" class="node-note">transport to storage</text>

  <path d="M1215 184 H1229" fill="none" stroke="#008a82" stroke-width="3.5" marker-end="url(#arrow-teal)"/>

  <rect x="1233" y="72" width="150" height="224" rx="18" fill="#f7fbfa" stroke="#008a82" stroke-width="2"/>
  <rect x="1250" y="88" width="116" height="24" rx="12" fill="#dff1ee"/>
  <text x="1308" y="104" fill="#00746e" font-size="10" font-weight="900" letter-spacing=".8" text-anchor="middle">SHARED DESTINATION</text>
  <text x="1308" y="139" fill="#0b3b52" font-size="17" font-weight="800" text-anchor="middle">Geological</text>
  <text x="1308" y="159" fill="#0b3b52" font-size="17" font-weight="800" text-anchor="middle">CO₂ storage</text>

  <!-- Geological cross-section with injection well, caprock and reservoir -->
  <path d="M1246 181 C1262 175 1278 187 1294 181 C1311 175 1328 187 1345 181 C1354 178 1362 179 1370 182 V199 H1246 Z" fill="#dfead7"/>
  <path d="M1246 199 C1265 193 1283 207 1301 200 C1321 193 1347 207 1370 198 V218 H1246 Z" fill="#8f9d96"/>
  <path d="M1246 218 C1266 211 1286 226 1306 219 C1325 212 1348 226 1370 217 V244 H1246 Z" fill="#e7dfc9"/>
  <path d="M1246 244 C1265 237 1287 252 1306 245 C1326 238 1348 252 1370 243 V282 H1246 Z" fill="#cfe5e1"/>
  <g fill="#91b8ae" opacity=".8">
    <circle cx="1262" cy="260" r="2"/><circle cx="1274" cy="272" r="2"/><circle cx="1290" cy="255" r="2"/>
    <circle cx="1328" cy="268" r="2"/><circle cx="1351" cy="257" r="2"/><circle cx="1361" cy="274" r="2"/>
  </g>

  <path d="M1234 184 H1293 V251" fill="none" stroke="#008a82" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1287 184 H1299 M1287 189 H1299" stroke="#0b3b52" stroke-width="2"/>
  <path d="M1293 205 V244" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-teal)"/>
  <path d="M1293 250 V266 M1287 254 H1299 M1287 260 H1299" stroke="#008a82" stroke-width="2"/>
  <path d="M1296 253 C1310 245 1328 247 1338 256 C1348 264 1342 274 1327 276 C1312 278 1297 272 1290 264 C1285 259 1288 256 1296 253 Z" fill="#57b6ad" opacity=".72"/>
  <g fill="#fff" stroke="#008a82" stroke-width="1.4">
    <circle cx="1307" cy="259" r="3.5"/><circle cx="1320" cy="265" r="4.5"/><circle cx="1331" cy="259" r="3"/>
  </g>
</svg>
