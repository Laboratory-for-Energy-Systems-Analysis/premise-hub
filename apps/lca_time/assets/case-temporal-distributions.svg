<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 550" role="img" aria-labelledby="title desc">
  <title id="title">Illustrated greenfield BECCS and DACCS cohort schedules</title>
  <desc id="desc">The existing mature forest is shared history before the project decision. The reference leaves it standing and buys Northern European electricity and heat. Greenfield BECCS builds a new CHP and capture plant in 2027 to 2029, operates twenty annual harvest, CHP, capture, energy export, pipeline and storage cohorts from 2030 to 2049, retires equipment once in 2050, and routes post-harvest forest regrowth through 2132. DACCS retains its three-year construction, twenty operating years and one end-of-life event.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#17303d" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#738891"/></marker>
    <marker id="arrow-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3e7654"/></marker>
    <marker id="arrow-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4193b8"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}.title{fill:#0b3b52;font-size:19px;font-weight:900}.sub{fill:#60737b;font-size:10px;font-weight:700}.kicker{font-size:9px;font-weight:900;letter-spacing:.1em}.label{fill:#0b3b52;font-size:10px;font-weight:900}.note{fill:#60737b;font-size:8px;font-weight:700}.micro{fill:#60737b;font-size:7px;font-weight:800;text-anchor:middle}.year{fill:#50656f;font-size:8px;font-weight:800;text-anchor:middle}.panel{fill:#f8fafb;stroke:#d3e0e4}.card{fill:#fff;stroke:#cfdbdf;filter:url(#shadow)}.build{fill:#eef2f3;stroke:#aabcc2}.operate-g{fill:#f2f8f4;stroke:#96bda2}.operate-b{fill:#f1f8fa;stroke:#9ec8d7}.eol{fill:#fbf0f1;stroke:#d7a4a9}.flow{fill:none;stroke:#738891;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.flow-g{fill:none;stroke:#3e7654;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.flow-b{fill:none;stroke:#4193b8;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.year-highlight{display:none}.year-highlight:target{display:inline}
    </style>
    <symbol id="forest" viewBox="0 0 50 42"><path d="M4 36H47" stroke="#936d4f" stroke-width="2"/><g fill="#dceee2" stroke="#3e7654" stroke-width="2" stroke-linejoin="round"><path d="M5 32L15 18H10L21 2L32 18H27L37 32Z"/><path d="M27 34L35 22H31L39 9L48 25H44L49 34Z"/></g><path d="M21 18V37M39 24V37" stroke="#936d4f" stroke-width="2"/></symbol>
    <symbol id="build" viewBox="0 0 50 42"><g fill="none" stroke="#0b3b52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 38V5H16V38M16 9H44M16 14H39M33 9V28M29 28H37L35 34H31Z"/><path d="M5 38H45"/></g><path d="M8 9L16 5M8 17L16 13M8 25L16 21M8 33L16 29" stroke="#9eb0b7" stroke-width="1.5"/></symbol>
    <symbol id="chp" viewBox="0 0 50 42"><g stroke="#0b3b52" stroke-width="2" stroke-linejoin="round"><path d="M3 37V18L14 25V17L25 25V10H38V37Z" fill="#fff"/><path d="M32 10V2H41V37" fill="#fff"/><path d="M1 37H46"/></g><path d="M36 1C31-3 41-6 37-10" fill="none" stroke="#92a4ad" stroke-width="2"/><path d="M9 30H14M21 30H26" stroke="#d99614" stroke-width="2"/></symbol>
    <symbol id="capture" viewBox="0 0 50 42"><rect x="6" y="5" width="15" height="33" rx="5" fill="#edf6f8" stroke="#0b3b52" stroke-width="2"/><rect x="29" y="5" width="15" height="33" rx="5" fill="#fff5de" stroke="#0b3b52" stroke-width="2"/><path d="M21 12H29M21 31H29" stroke="#0b3b52" stroke-width="2"/><path d="M9 15H18M9 22H18M9 29H18" stroke="#77a9ba"/></symbol>
    <symbol id="power" viewBox="0 0 50 42"><circle cx="25" cy="21" r="18" fill="#fff5de" stroke="#d99614" stroke-width="1.7"/><path d="M28 4L14 23H23L19 38L36 17H27Z" fill="#d99614"/></symbol>
    <symbol id="heat" viewBox="0 0 50 42"><rect x="4" y="8" width="42" height="29" rx="6" fill="#fff5de" stroke="#d99614" stroke-width="1.7"/><path d="M13 30C7 23 18 20 13 13M25 30C19 23 30 20 25 13M37 30C31 23 42 20 37 13" fill="none" stroke="#d99614" stroke-width="2.5" stroke-linecap="round"/></symbol>
    <symbol id="store" viewBox="0 0 55 42"><path d="M2 12H31V31" fill="none" stroke="#008a82" stroke-width="5" stroke-linecap="round"/><path d="M31 15V33" stroke="#fff" stroke-width="1.3" stroke-dasharray="3 2"/><path d="M8 18C18 15 28 22 38 18C45 15 49 17 53 18V27C45 24 38 31 29 27C20 23 12 29 3 27Z" fill="#8f9d96"/><path d="M3 28C13 25 21 33 31 29C41 25 47 30 53 28V41H3Z" fill="#cfe5e1"/><path d="M31 33C38 29 48 31 50 36C47 40 37 41 30 37Z" fill="#57b6ad"/></symbol>
    <symbol id="dac" viewBox="0 0 50 42"><rect x="3" y="4" width="44" height="34" rx="6" fill="#edf6f9" stroke="#0b3b52" stroke-width="2"/><circle cx="18" cy="21" r="10" fill="#fff" stroke="#4193b8" stroke-width="2"/><g fill="#b8dce9" stroke="#4193b8"><path d="M18 21C12 16 14 11 18 11C23 12 23 17 18 21Z"/><path d="M18 21C24 20 27 24 24 28C21 32 18 27 18 21Z"/><path d="M18 21C17 27 12 29 9 25C7 21 12 18 18 21Z"/></g><path d="M33 9V33M39 9V33" stroke="#4193b8" stroke-width="2"/></symbol>
    <symbol id="eol" viewBox="0 0 50 42"><g fill="none" stroke="#c44e52" stroke-width="3" stroke-linecap="round"><path d="M10 17C15 5 32 4 39 14M35 7L40 14L32 16M40 25C34 38 17 39 10 28M15 35L9 28L17 26"/></g></symbol>
  </defs>

  <text x="20" y="27" class="title">Each selected cohort retains the project decision and every dated branch</text>
  <text x="20" y="46" class="sub">Existing forest history is shared; new construction, annual operation, energy substitution, storage and future regrowth are project consequences.</text>

  <rect x="20" y="62" width="1120" height="104" rx="15" fill="#f2f5f6" stroke="#b9cbd1" stroke-dasharray="7 5"/>
  <text x="38" y="83" class="kicker" fill="#60737b">BEFORE THE DECISION · SHARED PHYSICAL HISTORY</text>
  <g transform="translate(43 94)"><rect width="140" height="55" rx="12" class="card"/><use href="#forest" x="7" y="6" width="46" height="38"/><text x="94" y="23" class="label" text-anchor="middle">Mature forest</text><text x="94" y="39" class="note" text-anchor="middle">existing stock</text></g>
  <path d="M188 122H225" class="flow" marker-end="url(#arrow)"/>
  <g transform="translate(230 92)"><rect width="272" height="60" rx="12" fill="#fff" stroke="#cad7db"/><text x="136" y="21" class="label" text-anchor="middle">2025 decision</text><text x="136" y="38" class="note" text-anchor="middle">leave forest standing, or harvest + regrow</text><text x="136" y="51" class="note" text-anchor="middle">and build a new CHP with CCS</text></g>
  <path d="M507 122H544" class="flow" marker-end="url(#arrow)"/>
  <g transform="translate(549 92)"><rect width="250" height="60" rx="12" fill="#f7faf8" stroke="#96bda2"/><text x="125" y="20" class="label" text-anchor="middle">Reference</text><text x="125" y="37" class="note" text-anchor="middle">forest remains standing at constant stock</text><text x="125" y="50" class="note" text-anchor="middle">buy Northern European power + heat</text></g>
  <path d="M804 122H841" class="flow" marker-end="url(#arrow)"/>
  <g transform="translate(846 91)"><rect width="266" height="62" rx="13" fill="#0b3b52"/><text x="133" y="24" fill="#fff" font-size="12" font-weight="900" text-anchor="middle">SHARED HISTORY CANCELS</text><text x="133" y="42" fill="#dcebee" font-size="9" font-weight="700" text-anchor="middle">zero project score before 2027</text><text x="133" y="54" fill="#dcebee" font-size="8" font-weight="700" text-anchor="middle">future forest trajectories do not cancel</text></g>

  <rect x="20" y="179" width="1120" height="196" rx="15" class="panel"/>
  <text x="38" y="201" class="kicker" fill="#3e7654">BECCS · NEW CHP + CCS FROM AN EXISTING FOREST</text>
  <g transform="translate(38 218)"><rect width="104" height="70" rx="12" class="build"/><use href="#build" x="29" y="6" width="46" height="38"/><text x="52" y="56" class="label" text-anchor="middle">BUILD</text><text x="52" y="67" class="note" text-anchor="middle">2027–2029</text></g>
  <path d="M147 253H168" class="flow" marker-end="url(#arrow)"/>
  <rect x="173" y="214" width="617" height="82" rx="12" class="operate-g"/>
  <text x="481" y="229" class="label" text-anchor="middle">20 ANNUAL PROJECT COHORTS · 2030–2049</text>
  <g transform="translate(190 240)"><use href="#forest" width="39" height="33"/><text x="20" y="44" class="micro">HARVEST</text></g>
  <path d="M234 255H253" class="flow-g" marker-end="url(#arrow-g)"/>
  <g transform="translate(258 240)"><use href="#chp" width="39" height="33"/><text x="20" y="44" class="micro">NEW CHP</text></g>
  <path d="M302 255H321" class="flow-g" marker-end="url(#arrow-g)"/>
  <g transform="translate(326 240)"><use href="#capture" width="39" height="33"/><text x="20" y="44" class="micro">CAPTURE</text></g>
  <path d="M370 255H389" class="flow-g" marker-end="url(#arrow-g)"/>
  <g transform="translate(394 240)"><use href="#power" width="39" height="33"/><text x="20" y="44" class="micro">0.56 MWh</text></g>
  <g transform="translate(455 240)"><use href="#heat" width="39" height="33"/><text x="20" y="44" class="micro">0.25 GJ</text></g>
  <path d="M499 255H518" class="flow-g" marker-end="url(#arrow-g)"/>
  <g transform="translate(523 240)"><use href="#store" width="43" height="33"/><text x="22" y="44" class="micro">PIPE + STORE</text></g>
  <rect x="585" y="239" width="187" height="42" rx="9" fill="#fff" stroke="#a8c9b1"/><text x="678" y="254" class="note" text-anchor="middle">annual Northern Europe</text><text x="678" y="268" class="label" text-anchor="middle">energy credits + backgrounds</text>
  <path d="M795 253H816" class="flow" marker-end="url(#arrow)"/>
  <g transform="translate(821 218)"><rect width="82" height="70" rx="12" class="eol"/><use href="#eol" x="20" y="6" width="42" height="35"/><text x="41" y="56" class="label" text-anchor="middle">EOL</text><text x="41" y="67" class="note" text-anchor="middle">2050 once</text></g>
  <g transform="translate(925 212)"><rect width="187" height="86" rx="12" fill="#edf7ef" stroke="#7ba887"/><use href="#forest" x="7" y="8" width="48" height="40"/><text x="121" y="24" class="label" text-anchor="middle">Replacement stands</text><text x="121" y="41" class="note" text-anchor="middle">83-year regrowth after</text><text x="121" y="54" class="note" text-anchor="middle">each annual harvest</text><text x="121" y="72" class="label" text-anchor="middle">2031–2132</text></g>
  <path d="M229 281C312 331 822 329 933 292" class="flow-g" marker-end="url(#arrow-g)"/>
  <path d="M72 330H1105" class="flow" marker-end="url(#arrow)"/>
  <g fill="#3e7654"><circle cx="185" cy="330" r="4"/><circle cx="216" cy="330" r="4"/><circle cx="247" cy="330" r="4"/><circle cx="278" cy="330" r="4"/><circle cx="309" cy="330" r="4"/><circle cx="340" cy="330" r="4"/><circle cx="371" cy="330" r="4"/><circle cx="402" cy="330" r="4"/><circle cx="433" cy="330" r="4"/><circle cx="464" cy="330" r="4"/><circle cx="495" cy="330" r="4"/><circle cx="526" cy="330" r="4"/><circle cx="557" cy="330" r="4"/><circle cx="588" cy="330" r="4"/><circle cx="619" cy="330" r="4"/><circle cx="650" cy="330" r="4"/><circle cx="681" cy="330" r="4"/><circle cx="712" cy="330" r="4"/><circle cx="743" cy="330" r="4"/><circle cx="774" cy="330" r="4"/></g>
  <path d="M903 330C955 315 1012 315 1105 330" class="flow-g" stroke-dasharray="5 4"/>
  <text x="72" y="348" class="year">2027</text><text x="185" y="348" class="year">2030</text><text x="495" y="348" class="year">2040</text><text x="774" y="348" class="year">2049</text><text x="862" y="348" class="year">2050</text><text x="1105" y="348" class="year">2132</text>
  <text x="38" y="365" class="note">149 kt net stored over the cohort · forest regrowth is a dated project branch, not pre-project uptake</text>

  <rect x="20" y="388" width="1120" height="125" rx="15" class="panel"/>
  <text x="38" y="410" class="kicker" fill="#4193b8">DACCS · ENGINEERED AIR-CAPTURE ROUTE (UNCHANGED)</text>
  <g transform="translate(42 425)"><rect width="95" height="62" rx="12" class="build"/><use href="#build" x="25" y="5" width="45" height="35"/><text x="47" y="51" class="note" text-anchor="middle">2027–2029</text></g>
  <path d="M142 456H166" class="flow" marker-end="url(#arrow)"/>
  <rect x="171" y="421" width="655" height="70" rx="12" class="operate-b"/>
  <text x="498" y="436" class="label" text-anchor="middle">20 ANNUAL OPERATIONS · 2030–2049</text>
  <g transform="translate(201 445)"><use href="#dac" width="40" height="34"/><text x="20" y="44" class="micro">AIR CONTACTOR</text></g>
  <path d="M246 457H288" class="flow-b" marker-end="url(#arrow-b)"/>
  <g transform="translate(293 445)"><use href="#power" width="40" height="34"/><text x="20" y="44" class="micro">GRID + HEAT PUMP</text></g>
  <path d="M338 457H380" class="flow-b" marker-end="url(#arrow-b)"/>
  <g transform="translate(385 445)"><use href="#store" width="43" height="34"/><text x="22" y="44" class="micro">PIPE + STORE</text></g>
  <rect x="452" y="441" width="219" height="37" rx="9" fill="#fff" stroke="#afd0db"/><text x="561" y="456" class="note" text-anchor="middle">matching annual</text><text x="561" y="469" class="label" text-anchor="middle">Northern European background</text>
  <text x="746" y="451" class="label" text-anchor="middle">1.944 Mt</text><text x="746" y="467" class="note" text-anchor="middle">net stored</text>
  <path d="M831 456H855" class="flow" marker-end="url(#arrow)"/>
  <g transform="translate(860 425)"><rect width="90" height="62" rx="12" class="eol"/><use href="#eol" x="24" y="5" width="42" height="35"/><text x="45" y="51" class="note" text-anchor="middle">2050 once</text></g>
  <text x="1030" y="448" class="label" text-anchor="middle">no forest branch</text><text x="1030" y="466" class="note" text-anchor="middle">route ends at EOL</text>

  <g id="y2030" class="year-highlight"><rect x="177" y="204" width="16" height="292" rx="7" fill="#f0bd45" opacity=".28"/><circle cx="185" cy="330" r="8" fill="none" stroke="#d99614" stroke-width="3"/></g>
  <g id="y2040" class="year-highlight"><rect x="487" y="204" width="16" height="292" rx="7" fill="#f0bd45" opacity=".28"/><circle cx="495" cy="330" r="8" fill="none" stroke="#d99614" stroke-width="3"/></g>
  <g id="y2049" class="year-highlight"><rect x="766" y="204" width="16" height="292" rx="7" fill="#f0bd45" opacity=".28"/><circle cx="774" cy="330" r="8" fill="none" stroke="#d99614" stroke-width="3"/></g>
