    <rect x="813" y="210" width="98" height="86" rx="15" fill="#f0bd45" opacity=".22"/>
    <rect x="815" y="212" width="94" height="82" rx="14" fill="none" stroke="#d99614" stroke-width="3"/>
    <rect x="852" y="417" width="106" height="78" rx="15" fill="#f0bd45" opacity=".22"/>
    <rect x="854" y="419" width="102" height="74" rx="14" fill="none" stroke="#d99614" stroke-width="3"/>
    <rect x="854" y="316" width="16" height="43" rx="7" fill="#f0bd45" opacity=".28"/>
    <circle cx="862" cy="330" r="8" fill="none" stroke="#d99614" stroke-width="3"/>
  </g>
  <text x="20" y="535" class="sub">Selected state: operating year → foreground + matching annual background; 2050 → one-off equipment end-of-life only.</text>
