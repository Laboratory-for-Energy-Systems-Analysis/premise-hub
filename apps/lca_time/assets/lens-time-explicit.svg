<svg xmlns="http://www.w3.org/2000/svg" width="420" height="150" viewBox="0 0 420 150" role="img" aria-labelledby="title desc">
  <title id="title">Time-explicit LCA climate response</title>
  <desc id="desc">Dated emissions and removals along a timeline are translated into a time-dependent climate response.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#008a82"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .label { fill: #0b3b52; font-size: 13px; font-weight: 800; }
    .small { fill: #5b6a74; font-size: 10px; font-weight: 700; letter-spacing: .3px; }
  </style>
  <text class="small" x="17" y="18">DATED EXCHANGES</text>
  <line x1="18" y1="73" x2="181" y2="73" stroke="#9fb0b7" stroke-width="2"/>
  <line x1="42" y1="73" x2="42" y2="34" stroke="#c44e52" stroke-width="4"/>
  <path d="M36 41 L42 31 L48 41" fill="#c44e52"/>
  <text x="42" y="26" text-anchor="middle" fill="#9b3438" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800">+CO₂</text>
  <line x1="88" y1="73" x2="88" y2="112" stroke="#3e7654" stroke-width="4"/>
  <path d="M82 105 L88 115 L94 105" fill="#3e7654"/>
  <text x="88" y="128" text-anchor="middle" fill="#315f43" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800">−CO₂</text>
  <line x1="134" y1="73" x2="134" y2="49" stroke="#c44e52" stroke-width="3"/>
  <path d="M129 55 L134 46 L139 55" fill="#c44e52"/>
  <circle cx="42" cy="73" r="4" fill="#0b3b52"/>
  <circle cx="88" cy="73" r="4" fill="#0b3b52"/>
  <circle cx="134" cy="73" r="4" fill="#0b3b52"/>
  <text class="small" x="18" y="145">2025</text>
  <text class="small" x="176" y="145" text-anchor="end">2100</text>
  <line x1="184" y1="73" x2="213" y2="73" stroke="#008a82" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="small" x="199" y="62" text-anchor="middle">MAP</text>
  <text class="small" x="229" y="18">CLIMATE RESPONSE</text>
  <line x1="229" y1="112" x2="405" y2="112" stroke="#c7d2d7" stroke-width="1.5"/>
  <line x1="229" y1="31" x2="229" y2="112" stroke="#c7d2d7" stroke-width="1.5"/>
  <line x1="229" y1="73" x2="405" y2="73" stroke="#c7d2d7" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M231 73 C247 44 268 36 296 40 S349 51 404 59" fill="none" stroke="#c44e52" stroke-width="2.5" stroke-linecap="round" opacity=".72"/>
  <path d="M231 73 C255 78 270 96 297 101 S350 98 404 90" fill="none" stroke="#3e7654" stroke-width="2.5" stroke-linecap="round" opacity=".72"/>
  <path d="M231 73 C252 53 274 51 299 59 S352 71 404 74" fill="none" stroke="#008a82" stroke-width="4" stroke-linecap="round"/>
  <text class="small" x="404" y="129" text-anchor="end">TIME</text>
  <text class="label" x="404" y="69" text-anchor="end">net effect</text>
</svg>
