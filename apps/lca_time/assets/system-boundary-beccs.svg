<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 450" role="img" aria-labelledby="title desc">
  <title id="title">Greenfield BECCS compared with a standing forest and Northern European energy</title>
  <desc id="desc">The reference lane leaves the mature spruce forest standing and purchases equivalent electricity and heat. The project lane harvests and regrows the forest, builds a biomass combined heat and power plant with post-combustion capture, exports the same useful energy, transports the captured carbon dioxide two thousand kilometres and stores one physical tonne after transport loss.</desc>
