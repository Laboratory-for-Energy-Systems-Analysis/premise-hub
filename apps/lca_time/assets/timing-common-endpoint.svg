<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 68" role="img" aria-labelledby="title desc">
  <title id="title">Two emissions evaluated against the same 2100 endpoint</title>
  <desc id="desc">An emission in 2025 influences 75 years before 2100, while an emission in 2080 influences only 20 years.</desc>
  <style>text{font-family:Arial,Helvetica,sans-serif}</style>
  <line x1="12" y1="52" x2="310" y2="52" stroke="#81959d" stroke-width="1.4"/>
  <path d="M310 52 l-6 -3 v6 z" fill="#81959d"/>
  <rect x="34" y="10" width="270" height="13" rx="6.5" fill="#b9d9e5"/>
  <rect x="232" y="31" width="72" height="13" rx="6.5" fill="#f1d58f"/>
  <line x1="34" y1="7" x2="34" y2="52" stroke="#c44e52" stroke-width="2.2"/>
  <path d="M30 10 h8 l-4 -5 z" fill="#c44e52"/>
  <line x1="232" y1="28" x2="232" y2="52" stroke="#d99614" stroke-width="2.2"/>
  <path d="M228 31 h8 l-4 -5 z" fill="#d99614"/>
  <line x1="304" y1="5" x2="304" y2="58" stroke="#0b3b52" stroke-width="1.4" stroke-dasharray="3 2"/>
  <text x="169" y="19" text-anchor="middle" fill="#245f78" font-size="8" font-weight="900">75 years of influence</text>
  <text x="268" y="40" text-anchor="middle" fill="#76510a" font-size="7.5" font-weight="900">20 years</text>
  <text x="34" y="66" text-anchor="middle" fill="#5d727a" font-size="7.5" font-weight="900">2025</text>
  <text x="232" y="66" text-anchor="middle" fill="#5d727a" font-size="7.5" font-weight="900">2080</text>
  <text x="304" y="66" text-anchor="middle" fill="#0b3b52" font-size="7.5" font-weight="900">2100</text>
</svg>
