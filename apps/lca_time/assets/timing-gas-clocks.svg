<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 68" role="img" aria-labelledby="title desc">
  <title id="title">Contrasting atmospheric clocks of methane and carbon dioxide</title>
  <desc id="desc">Methane has a strong but comparatively short-lived response, while the response to carbon dioxide persists much longer.</desc>
  <style>text{font-family:Arial,Helvetica,sans-serif}</style>
  <line x1="12" y1="56" x2="310" y2="56" stroke="#81959d" stroke-width="1.4"/>
  <path d="M310 56 l-6 -3 v6 z" fill="#81959d"/>
  <line x1="18" y1="6" x2="18" y2="56" stroke="#81959d" stroke-width="1.2"/>
  <path d="M15 9 h6 l-3 -5 z" fill="#81959d"/>
  <path d="M18 9 C31 12 39 34 55 46 C75 58 102 56 138 56" fill="none" stroke="#7656a8" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M18 13 C72 15 122 21 174 28 C226 35 270 40 307 43" fill="none" stroke="#4193b8" stroke-width="3.2" stroke-linecap="round"/>
  <text x="52" y="20" fill="#62448f" font-size="8.5" font-weight="900">CH₄ · short-lived</text>
  <text x="216" y="29" fill="#24657f" font-size="8.5" font-weight="900">CO₂ · persistent tail</text>
  <text x="309" y="66" text-anchor="end" fill="#6d8087" font-size="7" font-weight="800">time after emission →</text>
</svg>
