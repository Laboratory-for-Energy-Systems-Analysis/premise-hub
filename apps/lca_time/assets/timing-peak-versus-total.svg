<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 68" role="img" aria-labelledby="title desc">
  <title id="title">Equal totals with different climate trajectories and peaks</title>
  <desc id="desc">A front-loaded pathway and a later distributed pathway have the same total but different timing and peak climate responses.</desc>
  <style>text{font-family:Arial,Helvetica,sans-serif}</style>
  <line x1="12" y1="56" x2="310" y2="56" stroke="#81959d" stroke-width="1.4"/>
  <path d="M310 56 l-6 -3 v6 z" fill="#81959d"/>
  <path d="M18 56 C26 53 31 10 49 8 C70 6 84 28 96 42 C106 53 119 56 135 56 Z" fill="#f1cacc" opacity=".85"/>
  <path d="M18 56 C26 53 31 10 49 8 C70 6 84 28 96 42 C106 53 119 56 135 56" fill="none" stroke="#c44e52" stroke-width="2.8"/>
  <path d="M171 56 C181 53 190 27 213 22 C240 17 263 33 277 45 C288 53 298 56 307 56 Z" fill="#cfe4ec" opacity=".95"/>
  <path d="M171 56 C181 53 190 27 213 22 C240 17 263 33 277 45 C288 53 298 56 307 56" fill="none" stroke="#4193b8" stroke-width="2.8"/>
  <line x1="49" y1="7" x2="49" y2="56" stroke="#c44e52" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="222" y1="21" x2="222" y2="56" stroke="#4193b8" stroke-width="1" stroke-dasharray="2 2"/>
  <rect x="124" y="5" width="62" height="18" rx="9" fill="#ffffff" stroke="#c8d4d8"/>
  <text x="155" y="17" text-anchor="middle" fill="#0b3b52" font-size="8.5" font-weight="900">same total</text>
  <text x="49" y="66" text-anchor="middle" fill="#96383d" font-size="7" font-weight="900">early peak</text>
  <text x="238" y="66" text-anchor="middle" fill="#24657f" font-size="7" font-weight="900">later trajectory</text>
</svg>
