<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 215" role="img" aria-labelledby="title desc">
  <title id="title">Annual technosphere and biosphere matrix stacks</title>
  <desc id="desc">A has activity, product and year dimensions. B has activity, elementary flow and year dimensions. Each slice represents a calendar year's background.</desc>
  <!-- Cube geometry reused from lca_time/assets/premise-trails-handoff.svg. -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fcfb"/>
      <stop offset=".58" stop-color="#edf6f3"/>
      <stop offset="1" stop-color="#edf5f8"/>
    </linearGradient>
    <linearGradient id="cube-front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff2ee"/>
      <stop offset="1" stop-color="#b8ddd6"/>
    </linearGradient>
    <linearGradient id="cube-side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6e5df"/>
      <stop offset="1" stop-color="#92c8be"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#173b4a" flood-opacity=".11"/>
    </filter>
    <marker id="arrow-teal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#008a82"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#006b8f"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#7b9199"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#60487d"/>
    </marker>
  </defs>
  <style>text {font-family:Arial,Helvetica,sans-serif; fill:#0b3b52} .name {font-size:20px;font-weight:700} .dimension {font-size:15px;fill:#536c76}</style>
  <text x="135" y="25" text-anchor="middle" class="name">Technosphere A</text>
  <text x="405" y="25" text-anchor="middle" class="name">Biosphere B</text>
  <g transform="translate(40 65) scale(1.55) translate(-742 -83)">
  <g fill="#e9f5f2" stroke="#7ebdb3" stroke-width="1">
    <polygon points="742,98 829,98 829,138 742,138" opacity=".34"/>
    <polygon points="752,93 839,93 839,133 752,133" opacity=".44"/>
    <polygon points="762,88 849,88 849,128 762,128" opacity=".56"/>
    <polygon points="772,83 859,83 859,123 772,123" opacity=".70"/>
  </g>
  <polygon points="742,98 772,83 859,83 829,98" fill="#cbe7e1" stroke="#75b6ab"/>
  <polygon points="829,98 859,83 859,123 829,138" fill="url(#cube-side)" stroke="#75b6ab"/>
  <rect x="742" y="98" width="87" height="40" fill="url(#cube-front)" stroke="#5eaa9d" stroke-width="1.2"/>
  <g stroke="#8dc7bd" stroke-width=".8" opacity=".9">
    <line x1="759" y1="98" x2="759" y2="138"/><line x1="776" y1="98" x2="776" y2="138"/><line x1="793" y1="98" x2="793" y2="138"/><line x1="810" y1="98" x2="810" y2="138"/>
    <line x1="742" y1="108" x2="829" y2="108"/><line x1="742" y1="118" x2="829" y2="118"/><line x1="742" y1="128" x2="829" y2="128"/>
  </g>
  <g fill="#008a82">
    <rect x="761" y="110" width="13" height="6" rx="2"/><rect x="795" y="120" width="13" height="6" rx="2"/><rect x="778" y="130" width="13" height="6" rx="2"/><rect x="813" y="101" width="13" height="6" rx="2"/>
  </g>
  </g>
  <g transform="translate(310 65) scale(1.55) translate(-742 -83)">
  <g fill="#e9f5f2" stroke="#7ebdb3" stroke-width="1">
    <polygon points="742,98 829,98 829,138 742,138" opacity=".34"/>
    <polygon points="752,93 839,93 839,133 752,133" opacity=".44"/>
    <polygon points="762,88 849,88 849,128 762,128" opacity=".56"/>
    <polygon points="772,83 859,83 859,123 772,123" opacity=".70"/>
  </g>
  <polygon points="742,98 772,83 859,83 829,98" fill="#cbe7e1" stroke="#75b6ab"/>
  <polygon points="829,98 859,83 859,123 829,138" fill="url(#cube-side)" stroke="#75b6ab"/>
  <rect x="742" y="98" width="87" height="40" fill="url(#cube-front)" stroke="#5eaa9d" stroke-width="1.2"/>
  <g stroke="#8dc7bd" stroke-width=".8" opacity=".9">
    <line x1="759" y1="98" x2="759" y2="138"/><line x1="776" y1="98" x2="776" y2="138"/><line x1="793" y1="98" x2="793" y2="138"/><line x1="810" y1="98" x2="810" y2="138"/>
    <line x1="742" y1="108" x2="829" y2="108"/><line x1="742" y1="118" x2="829" y2="118"/><line x1="742" y1="128" x2="829" y2="128"/>
  </g>
  <g fill="#008a82">
    <rect x="761" y="110" width="13" height="6" rx="2"/><rect x="795" y="120" width="13" height="6" rx="2"/><rect x="778" y="130" width="13" height="6" rx="2"/><rect x="813" y="101" width="13" height="6" rx="2"/>
  </g>
  </g>
  <text x="223" y="63" text-anchor="middle" class="dimension">year ↗</text>
  <text x="493" y="63" text-anchor="middle" class="dimension">year ↗</text>
  <text x="135" y="185" text-anchor="middle" class="dimension">activity × product × year</text>
  <text x="405" y="185" text-anchor="middle" class="dimension">activity × flow × year</text>
</svg>
