<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img" aria-labelledby="title desc">
  <title id="title">Three nested analytical scales</title>
  <desc id="desc">A functional unit sits at the centre, a set of scenario inventories surrounds it, and total activity forms the outer system scale.</desc>
  <defs>
    <linearGradient id="scaleBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f2f7f8"/>
      <stop offset="1" stop-color="#fbf8ef"/>
    </linearGradient>
    <filter id="scaleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b3b52" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect x="5" y="5" width="590" height="550" rx="30" fill="url(#scaleBg)"/>

  <g font-family="Arial" fill="#0b3b52">
    <g transform="translate(300 280)">
      <circle r="226" fill="#eaf3f6" stroke="#006b8f" stroke-width="6"/>
      <circle r="164" fill="#fff" stroke="#008a82" stroke-width="5" stroke-dasharray="12 10"/>
      <circle r="88" fill="#fff7df" stroke="#d99614" stroke-width="5"/>

      <g transform="translate(-85 -218)">
        <rect width="170" height="32" rx="16" fill="#006b8f"/>
        <text x="85" y="21" text-anchor="middle" fill="#fff" font-size="15" font-weight="800" letter-spacing="1">SYSTEM ACTIVITY</text>
      </g>
      <g transform="translate(-66 -164)">
        <rect width="132" height="30" rx="15" fill="#008a82"/>
        <text x="66" y="20" text-anchor="middle" fill="#fff" font-size="16" font-weight="800" letter-spacing="1">SCENARIO SET</text>
      </g>

      <g transform="translate(-57 -48)">
        <path d="M8 93V35h30v18l31-18v18l31-18v58z" fill="#fff" stroke="#0b3b52" stroke-width="4" stroke-linejoin="round"/>
        <path d="M18 20h14v73H18z" fill="#fff" stroke="#0b3b52" stroke-width="4"/>
        <path d="M25 10v10" stroke="#0b3b52" stroke-width="4" stroke-linecap="round"/>
      </g>
      <rect x="-82" y="58" width="164" height="34" rx="17" fill="#d99614"/>
      <text y="80" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">1 FUNCTIONAL UNIT</text>

      <g filter="url(#scaleShadow)">
        <g transform="translate(-126 -83)">
          <rect width="62" height="74" rx="12" fill="#fff" stroke="#006b8f" stroke-width="3"/>
          <rect width="62" height="18" rx="9" fill="#eaf3f6"/>
          <path d="M12 34h38M12 48h28M12 61h34" stroke="#9fc8d5" stroke-width="3" stroke-linecap="round"/>
        </g>
        <g transform="translate(64 -83)">
          <rect width="62" height="74" rx="12" fill="#fff" stroke="#008a82" stroke-width="3"/>
          <rect width="62" height="18" rx="9" fill="#e7f5f2"/>
          <path d="M12 34h38M12 48h28M12 61h34" stroke="#8fc7c1" stroke-width="3" stroke-linecap="round"/>
        </g>
        <g transform="translate(-31 103)">
          <rect width="62" height="74" rx="12" fill="#fff" stroke="#d99614" stroke-width="3"/>
          <rect width="62" height="18" rx="9" fill="#fff3d2"/>
          <path d="M12 34h38M12 48h28M12 61h34" stroke="#dfbf71" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>

      <g filter="url(#scaleShadow)">
        <g transform="translate(-204 -62)">
          <circle cx="28" cy="28" r="27" fill="#fff" stroke="#006b8f" stroke-width="3"/>
          <path d="M17 39V23h9v5l10-5v5l10-5v16z" fill="#eaf3f6" stroke="#006b8f" stroke-width="2"/>
        </g>
        <g transform="translate(148 -62)">
          <circle cx="28" cy="28" r="27" fill="#fff" stroke="#008a82" stroke-width="3"/>
          <path d="M15 38h26M19 34l8-18 6 13 5-9" fill="none" stroke="#008a82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g transform="translate(-142 132)">
          <circle cx="28" cy="28" r="27" fill="#fff" stroke="#008a82" stroke-width="3"/>
          <path d="M14 34h28l-3-11H18zM21 23l4-8h7l4 8M20 39h2M35 39h2" fill="none" stroke="#006b8f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g transform="translate(86 132)">
          <circle cx="28" cy="28" r="27" fill="#fff" stroke="#d99614" stroke-width="3"/>
          <path d="M18 41V20h20v21M14 41h28M23 27h3M32 27h3M23 34h3M32 34h3" fill="none" stroke="#d99614" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>

      <g fill="#008a82" stroke="#fff" stroke-width="3">
        <circle cx="-92" cy="-192" r="8"/><circle cx="96" cy="-190" r="8"/>
        <circle cx="-185" cy="104" r="8"/><circle cx="185" cy="104" r="8"/>
      </g>
    </g>

    <g transform="translate(112 510)">
      <rect width="376" height="30" rx="15" fill="#0b3b52"/>
      <text x="188" y="20" text-anchor="middle" fill="#fff" font-size="17">
        prospective intensity  ×  compatible activity
      </text>
    </g>
  </g>
</svg>
