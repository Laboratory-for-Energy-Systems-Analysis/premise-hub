<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 570" role="img" aria-labelledby="title desc">
  <title id="title">Premise in the prospective LCA software ecosystem</title>
  <desc id="desc">Scenario and inventory sources flow into Premise; transformed inventories flow to Brightway, Activity Browser, Pathways, and exchange tools.</desc>
  <defs>
    <linearGradient id="networkBg" x1="0" x2="1">
      <stop stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fbf8ef"/>
    </linearGradient>
    <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b3b52" flood-opacity=".10"/>
    </filter>
    <marker id="inArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0l9 4.5L0 9z" fill="#008a82"/>
    </marker>
    <marker id="outArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0l9 4.5L0 9z" fill="#d99614"/>
    </marker>
    <marker id="trailArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0l9 4.5L0 9z" fill="#e56b38"/>
    </marker>
  </defs>
  <rect x="5" y="5" width="1070" height="560" rx="32" fill="url(#networkBg)"/>

