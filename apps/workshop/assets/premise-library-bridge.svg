<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Premise translates quantified pathways into prospective inventories</title>
  <desc id="desc">Scenario trajectories enter a central Premise translation layer and emerge as internally consistent inventory datasets for 2030, 2050, and 2100.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop stop-color="#f2f7f8"/>
      <stop offset="1" stop-color="#fbf8ef"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0a8f86"/>
      <stop offset="1" stop-color="#006b8f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0b3b52" flood-opacity=".10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#006b8f"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#d99614"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="1088" height="548" rx="32" fill="url(#bg)"/>

  <g font-family="Arial" fill="#0b3b52">
    <text x="62" y="56" font-size="20" font-weight="800" letter-spacing="2">QUANTIFIED PATHWAYS</text>
    <text x="790" y="56" font-size="19" font-weight="800" letter-spacing="2">FUTURE LCI DATABASES</text>

    <g transform="translate(54 78)" filter="url(#soft)">
      <rect width="300" height="392" rx="24" fill="#fff" stroke="#d9e5e8" stroke-width="2"/>
      <g transform="translate(22 20)">
        <rect width="80" height="34" rx="17" fill="#eaf3f6"/>
        <text x="40" y="22" text-anchor="middle" font-size="17" font-weight="700">MODEL</text>
        <rect x="88" width="96" height="34" rx="17" fill="#e7f5f2"/>
        <text x="136" y="22" text-anchor="middle" font-size="17" font-weight="700">PATHWAY</text>
        <rect x="192" width="64" height="34" rx="17" fill="#fff3d2"/>
        <text x="224" y="22" text-anchor="middle" font-size="17" font-weight="700">YEAR</text>
      </g>
      <g transform="translate(26 92)">
        <path d="M0 0v232h244" fill="none" stroke="#b8cbd2" stroke-width="2"/>
        <path d="M0 58h244M0 116h244M0 174h244" stroke="#dfe8eb" stroke-width="2"/>
        <path d="M42 0v232M102 0v232M162 0v232M222 0v232" stroke="#edf2f4" stroke-width="2"/>
        <path d="M4 190C40 174 70 150 104 133s67-31 136-86" fill="none" stroke="#006b8f" stroke-width="6" stroke-linecap="round"/>
        <path d="M4 151c42-8 73-29 111-27s68-20 125-77" fill="none" stroke="#008a82" stroke-width="6" stroke-linecap="round"/>
        <path d="M4 111c45 5 79-8 116 5s72-2 120-37" fill="none" stroke="#d99614" stroke-width="6" stroke-linecap="round"/>
        <g fill="#fff" stroke-width="4">
          <circle cx="104" cy="133" r="7" stroke="#006b8f"/>
          <circle cx="115" cy="124" r="7" stroke="#008a82"/>
          <circle cx="120" cy="116" r="7" stroke="#d99614"/>
          <circle cx="240" cy="47" r="7" stroke="#006b8f"/>
        </g>
      </g>
      <text x="150" y="360" text-anchor="middle" font-size="20" font-weight="700">regions · years · variables</text>
    </g>

    <g fill="none" stroke-linecap="round">
      <path d="M354 212C395 212 399 222 432 222" stroke="#006b8f" stroke-width="7" marker-end="url(#arrowBlue)"/>
      <path d="M354 274C397 274 401 280 432 280" stroke="#008a82" stroke-width="7" marker-end="url(#arrowBlue)"/>
      <path d="M354 336C395 336 399 338 432 338" stroke="#d99614" stroke-width="7" marker-end="url(#arrowGold)"/>
    </g>

    <g transform="translate(438 66)" filter="url(#soft)">
      <rect width="244" height="430" rx="28" fill="url(#layer)"/>
      <rect x="16" y="16" width="212" height="398" rx="20" fill="#fff"/>
      <rect x="34" y="34" width="176" height="30" rx="15" fill="#0b3b52"/>
      <text x="122" y="54" text-anchor="middle" fill="#fff" font-size="13" font-weight="800" letter-spacing="1">TRANSLATION LAYER</text>
      <text x="122" y="278" text-anchor="middle" fill="#008a82" font-size="15" font-weight="700">scenario data → LCI rules</text>
      <g transform="translate(34 306)">
        <rect width="52" height="42" rx="11" fill="#eaf3f6"/><text x="26" y="26" text-anchor="middle" font-size="14" font-weight="800">MAP</text>
        <rect x="62" width="66" height="42" rx="11" fill="#e7f5f2"/><text x="95" y="26" text-anchor="middle" font-size="14" font-weight="800">UPDATE</text>
        <rect x="138" width="64" height="42" rx="11" fill="#fff3d2"/><text x="170" y="26" text-anchor="middle" font-size="14" font-weight="800">RELINK</text>
      </g>
      <text x="122" y="388" text-anchor="middle" fill="#5b6a74" font-family="monospace" font-size="15">NewDatabase()</text>
    </g>

    <g fill="none" stroke-linecap="round">
      <path d="M682 222C724 222 730 200 770 200" stroke="#006b8f" stroke-width="7" marker-end="url(#arrowBlue)"/>
      <path d="M682 280h88" stroke="#008a82" stroke-width="7" marker-end="url(#arrowBlue)"/>
      <path d="M682 338C724 338 730 360 770 360" stroke="#d99614" stroke-width="7" marker-end="url(#arrowGold)"/>
    </g>

    <g transform="translate(790 82)" filter="url(#soft)">
      <g transform="translate(0 0)">
        <rect width="248" height="124" rx="20" fill="#fff" stroke="#006b8f" stroke-width="4"/>
        <rect width="76" height="124" rx="20" fill="#eaf3f6"/>
        <text x="38" y="70" text-anchor="middle" font-size="23" font-weight="800">2030</text>
        <g transform="translate(98 25)" stroke="#9fc8d5" stroke-width="4" stroke-linecap="round">
          <path d="M0 0h118M0 25h88M0 50h108M0 75h64"/>
        </g>
      </g>
      <g transform="translate(0 144)">
        <rect width="248" height="124" rx="20" fill="#fff" stroke="#008a82" stroke-width="4"/>
        <rect width="76" height="124" rx="20" fill="#e7f5f2"/>
        <text x="38" y="70" text-anchor="middle" font-size="23" font-weight="800">2050</text>
        <g transform="translate(98 25)" stroke="#8fc7c1" stroke-width="4" stroke-linecap="round">
          <path d="M0 0h118M0 25h88M0 50h108M0 75h64"/>
        </g>
      </g>
      <g transform="translate(0 288)">
        <rect width="248" height="124" rx="20" fill="#fff" stroke="#d99614" stroke-width="4"/>
        <rect width="76" height="124" rx="20" fill="#fff3d2"/>
        <text x="38" y="70" text-anchor="middle" font-size="23" font-weight="800">2100</text>
        <g transform="translate(98 25)" stroke="#dfbf71" stroke-width="4" stroke-linecap="round">
          <path d="M0 0h118M0 25h88M0 50h108M0 75h64"/>
        </g>
      </g>
    </g>
  </g>
</svg>
