<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">Premise update workflow</title>
  <desc id="desc">Scenario details and a background life-cycle inventory enter a three-stage mapping, updating and relinking workflow that produces prospective inventories.</desc>
  <defs>
    <linearGradient id="workflowBg" x1="0" x2="1">
      <stop stop-color="#f1f7f8"/>
      <stop offset="1" stop-color="#fbf8ef"/>
    </linearGradient>
    <filter id="workflowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b3b52" flood-opacity=".10"/>
    </filter>
    <marker id="workflowArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#d99614"/>
    </marker>
  </defs>
  <rect x="5" y="5" width="1170" height="510" rx="30" fill="url(#workflowBg)"/>

  <g font-family="Arial" fill="#0b3b52">
    <g transform="translate(34 60)">
      <g filter="url(#workflowShadow)">
        <rect width="220" height="142" rx="22" fill="#fff" stroke="#d9e5e8" stroke-width="2"/>
        <circle cx="48" cy="50" r="26" fill="#eaf3f6"/>
        <path d="M30 50h36M36 39h24M36 61h24M48 24c-13 15-13 37 0 52M48 24c13 15 13 37 0 52" fill="none" stroke="#006b8f" stroke-width="2.5"/>
        <text x="88" y="40" font-size="17" font-weight="800" letter-spacing="1">SCENARIO</text>
        <text x="88" y="64" font-size="16" font-weight="700">model · pathway</text>
        <text x="88" y="86" font-size="18" font-weight="700">year</text>
        <g transform="translate(22 108)">
          <rect width="52" height="24" rx="12" fill="#eaf3f6"/><text x="26" y="17" text-anchor="middle" font-size="13" font-weight="700">IMAGE</text>
          <rect x="58" width="72" height="24" rx="12" fill="#e7f5f2"/><text x="94" y="17" text-anchor="middle" font-size="13" font-weight="700">SSP2-M</text>
          <rect x="136" width="54" height="24" rx="12" fill="#fff3d2"/><text x="163" y="17" text-anchor="middle" font-size="13" font-weight="700">2050</text>
        </g>
      </g>

      <g transform="translate(0 226)" filter="url(#workflowShadow)">
        <rect width="220" height="142" rx="22" fill="#fff" stroke="#d9e5e8" stroke-width="2"/>
        <g transform="translate(20 25)">
          <ellipse cx="30" cy="11" rx="29" ry="10" fill="#d9edf2" stroke="#006b8f" stroke-width="3"/>
          <path d="M1 11v42c0 7 13 12 29 12s29-5 29-12V11" fill="#fff" stroke="#006b8f" stroke-width="3"/>
          <ellipse cx="30" cy="53" rx="29" ry="11" fill="#d9edf2" stroke="#006b8f" stroke-width="3"/>
        </g>
        <text x="88" y="45" font-size="15" font-weight="800" letter-spacing="1">BACKGROUND LCI</text>
        <text x="88" y="72" font-size="16" font-weight="700">ecoinvent + LCIs</text>
        <text x="22" y="113" fill="#5b6a74" font-size="14">datasets · links · locations</text>
      </g>
    </g>

    <g fill="none" stroke="#008a82" stroke-width="6" stroke-linecap="round">
      <path d="M254 131h54c32 0 34 62 62 62"/>
      <path d="M254 357h54c32 0 34-62 62-62"/>
      <path d="M370 193v102"/>
    </g>
    <circle cx="370" cy="244" r="9" fill="#fff" stroke="#008a82" stroke-width="5"/>

    <g transform="translate(348 46)">
      <rect x="72" width="440" height="42" rx="21" fill="#0b3b52"/>
      <text x="292" y="27" text-anchor="middle" fill="#fff" font-size="17" font-style="italic" font-weight="700">Premise update workflow</text>
    </g>

    <path d="M378 244H908" fill="none" stroke="#b7d7d8" stroke-width="14" stroke-linecap="round"/>
    <path d="M378 244H908" fill="none" stroke="#008a82" stroke-width="4" stroke-linecap="round" marker-end="url(#workflowArrow)"/>

    <g transform="translate(410 120)">
      <g filter="url(#workflowShadow)">
        <circle cx="74" cy="124" r="72" fill="#fff" stroke="#006b8f" stroke-width="5"/>
        <g transform="translate(38 88)">
          <rect width="72" height="72" rx="10" fill="#eaf3f6"/>
          <path d="M10 10h52M10 27h52M10 44h52M10 61h52M27 10v51M49 10v51" stroke="#9fc8d5" stroke-width="3"/>
          <rect x="29" y="29" width="18" height="13" rx="3" fill="#006b8f"/>
        </g>
      </g>
      <text x="74" y="220" text-anchor="middle" font-size="19" font-weight="800">MAP</text>
      <text x="74" y="244" text-anchor="middle" fill="#5b6a74" font-size="15">variables → rules</text>
    </g>

    <g transform="translate(582 120)">
      <g filter="url(#workflowShadow)">
        <circle cx="74" cy="124" r="72" fill="#fff" stroke="#008a82" stroke-width="5"/>
        <g transform="translate(35 85)">
          <path d="M4 74V18M4 74h76" stroke="#0b3b52" stroke-width="4" stroke-linecap="round"/>
          <rect x="16" y="49" width="13" height="25" rx="3" fill="#9fc8d5"/>
          <rect x="37" y="35" width="13" height="39" rx="3" fill="#008a82"/>
          <rect x="58" y="18" width="13" height="56" rx="3" fill="#d99614"/>
          <path d="M16 38l24-17 19 3 21-18" fill="none" stroke="#e56b38" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
      <text x="74" y="220" text-anchor="middle" font-size="19" font-weight="800">UPDATE</text>
      <text x="74" y="244" text-anchor="middle" fill="#5b6a74" font-size="15">markets · efficiency</text>
    </g>

    <g transform="translate(754 120)">
      <g filter="url(#workflowShadow)">
        <circle cx="74" cy="124" r="72" fill="#fff" stroke="#d99614" stroke-width="5"/>
        <g transform="translate(28 86)">
          <path d="M20 57L66 18M20 18l46 39" fill="none" stroke="#d99614" stroke-width="5" stroke-linecap="round"/>
          <circle cx="20" cy="18" r="11" fill="#fff" stroke="#006b8f" stroke-width="4"/>
          <circle cx="20" cy="57" r="11" fill="#fff" stroke="#008a82" stroke-width="4"/>
          <circle cx="66" cy="18" r="11" fill="#fff" stroke="#d99614" stroke-width="4"/>
          <path d="M66 42c-12 0-21 9-21 20 0 16 21 34 21 34s21-18 21-34c0-11-9-20-21-20z" fill="#e56b38"/>
          <circle cx="66" cy="62" r="6" fill="#fff"/>
        </g>
      </g>
      <text x="74" y="220" text-anchor="middle" font-size="19" font-weight="800">RELINK</text>
      <text x="74" y="244" text-anchor="middle" fill="#5b6a74" font-size="15">regional suppliers</text>
    </g>

    <g transform="translate(926 62)" filter="url(#workflowShadow)">
      <text x="104" y="0" text-anchor="middle" font-size="17" font-weight="800" letter-spacing="1">BUILD OUTPUTS</text>
      <g transform="translate(0 24)">
        <rect width="208" height="104" rx="18" fill="#fff" stroke="#006b8f" stroke-width="4"/>
        <rect width="60" height="104" rx="18" fill="#eaf3f6"/>
        <text x="30" y="59" text-anchor="middle" font-size="20" font-weight="800">2030</text>
        <path d="M82 28h94M82 51h72M82 74h86" stroke="#9fc8d5" stroke-width="4" stroke-linecap="round"/>
      </g>
      <g transform="translate(0 142)">
        <rect width="208" height="104" rx="18" fill="#fff" stroke="#008a82" stroke-width="4"/>
        <rect width="60" height="104" rx="18" fill="#e7f5f2"/>
        <text x="30" y="59" text-anchor="middle" font-size="20" font-weight="800">2050</text>
        <path d="M82 28h94M82 51h72M82 74h86" stroke="#8fc7c1" stroke-width="4" stroke-linecap="round"/>
      </g>
      <g transform="translate(0 260)">
        <rect width="208" height="104" rx="18" fill="#fff" stroke="#d99614" stroke-width="4"/>
        <rect width="60" height="104" rx="18" fill="#fff3d2"/>
        <text x="30" y="59" text-anchor="middle" font-size="20" font-weight="800">2100</text>
        <path d="M82 28h94M82 51h72M82 74h86" stroke="#dfbf71" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>

    <rect x="470" y="446" width="374" height="40" rx="20" fill="#e7f5f2"/>
    <text x="657" y="471" text-anchor="middle" fill="#008a82" font-family="monospace" font-size="16">ndb.update()  →  write_database()</text>
  </g>
</svg>
